<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Chemistry Beaker</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#0f172a;
    }

    .beaker{
        width:320px;
        filter: drop-shadow(0 20px 30px rgba(0,0,0,0.45));
        transition:0.4s;
    }

    .beaker:hover{
        transform: rotate(-2deg) scale(1.03);
    }
</style>
</head>

<body>

<svg class="beaker" viewBox="0 0 400 500">

    <defs>

        <!-- Main Glass -->
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
            <stop offset="50%" stop-color="#dbeafe" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
        </linearGradient>

        <!-- Liquid -->
        <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>

        <!-- Highlight -->
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>

        <!-- Blur -->
        <filter id="blur">
            <feGaussianBlur stdDeviation="6"/>
        </filter>

    </defs>

    <!-- Shadow -->
    <ellipse cx="200" cy="455" rx="95" ry="20"
        fill="#000"
        opacity="0.25"
        filter="url(#blur)"
    />

    <!-- Glass Body -->
    <path d="
        M120 60
        L120 360
        Q120 420 180 430
        L220 430
        Q280 420 280 360
        L280 60
        "
        fill="url(#glass)"
        stroke="#dbeafe"
        stroke-width="8"
        stroke-linejoin="round"
    />

    <!-- Top Rim -->
    <ellipse
        cx="200"
        cy="60"
        rx="82"
        ry="18"
        fill="#cbd5e1"
        opacity="0.5"
    />

    <!-- Liquid -->
    <path d="
        M132 270
        Q200 245 268 270
        L268 360
        Q268 405 220 412
        L180 412
        Q132 405 132 360
        Z
    "
    fill="url(#liquid)"
    opacity="0.9"
    />

    <!-- Liquid Glow -->
    <path d="
        M132 270
        Q200 245 268 270
    "
    fill="none"
    stroke="#7dd3fc"
    stroke-width="4"
    opacity="0.9"
    />

    <!-- Left Shine -->
    <path d="
        M145 90
        Q160 220 145 380
    "
    stroke="url(#shine)"
    stroke-width="14"
    stroke-linecap="round"
    opacity="0.8"
    />

    <!-- Right Shine -->
    <path d="
        M255 100
        Q245 240 255 360
    "
    stroke="#ffffff"
    stroke-opacity="0.18"
    stroke-width="6"
    stroke-linecap="round"
    />

    <!-- Measurement Lines -->
    <g stroke="#e2e8f0" stroke-width="3" opacity="0.7">

        <line x1="120" y1="120" x2="150" y2="120"/>
        <line x1="120" y1="170" x2="150" y2="170"/>
        <line x1="120" y1="220" x2="150" y2="220"/>
        <line x1="120" y1="270" x2="150" y2="270"/>
        <line x1="120" y1="320" x2="150" y2="320"/>

    </g>

    <!-- Text -->
    <text
        x="170"
        y="180"
        fill="#e2e8f0"
        font-size="22"
        font-family="Arial"
        opacity="0.8"
    >
        2500 ml
    </text>

</svg>

</body>
</html>
